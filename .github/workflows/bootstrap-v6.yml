name: Install corrected V6 source

on:
  push:
    branches:
      - redesign/v6-claude
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-v6:
    if: ${{ !contains(github.event.head_commit.message || '', '[v6-installed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: redesign/v6-claude
          fetch-depth: 0

      - name: Reconstruct corrected V6
        shell: bash
        run: |
          set -euo pipefail
          cat .v6-bootstrap/part-* | base64 -d > /tmp/fulham-v6.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .v6-bootstrap -exec rm -rf {} +
          tar -xzf /tmp/fulham-v6.tar.gz -C .
          rm -rf .v6-bootstrap
          rm -f .github/workflows/bootstrap-v6.yml
          rm -f .github/workflows/pages-v6-preview.yml

      - name: Verify no unrelated postcode
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules -E '6BW|SW6 6BW' .; then
            echo "ERROR: unrelated postcode found"
            exit 1
          fi
          git add -A
          echo 'git grep -n "6BW":'
          git grep --cached -n "6BW" || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run checker
        run: npm run check

      - name: Prepare V6 preview
        shell: bash
        run: |
          cp -a dist /tmp/v6-dist
          find /tmp/v6-dist -name '*.html' -type f -print0 | xargs -0 sed -i             -e 's|href="/|href="/fulham-plumbing/v6/|g'             -e 's|src="/|src="/fulham-plumbing/v6/|g'             -e 's|action="/|action="/fulham-plumbing/v6/|g'             -e 's|"serviceUrl":"/|"serviceUrl":"/fulham-plumbing/v6/|g'             -e 's|"guideUrl":"/|"guideUrl":"/fulham-plumbing/v6/|g'             -e 's|"href":"/|"href":"/fulham-plumbing/v6/|g'
          touch /tmp/v6-dist/.nojekyll

      - name: Commit corrected V6 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V6: Claude rebuild [v6-installed]"
          git push origin HEAD:redesign/v6-claude

      - name: Publish V6 preview
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          rm -rf /tmp/pages/v6
          mkdir -p /tmp/pages/v6
          cp -a /tmp/v6-dist/. /tmp/pages/v6/
          cd /tmp/pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v6
          if git diff --cached --quiet; then
            echo "No preview changes"
          else
            git commit -m "Preview: publish Fulham Plumbing V6"
            git push origin HEAD:gh-pages
          fi
