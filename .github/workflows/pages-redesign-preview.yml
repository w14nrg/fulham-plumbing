name: Publish redesign preview

on:
  push:
    branches:
      - redesign/v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign
        uses: actions/checkout@v4
        with:
          ref: redesign/v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: npm run build

      - name: Rewrite links for GitHub Pages v2 path
        run: |
          find dist -name '*.html' -type f -print0 | xargs -0 sed -i             -e 's|href="/|href="/fulham-plumbing/v2/|g'             -e 's|src="/|src="/fulham-plumbing/v2/|g'             -e 's|action="/|action="/fulham-plumbing/v2/|g'             -e 's|"serviceUrl":"/|"serviceUrl":"/fulham-plumbing/v2/|g'             -e 's|"guideUrl":"/|"guideUrl":"/fulham-plumbing/v2/|g'
          touch dist/.nojekyll

      - name: Checkout existing Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Replace only the v2 preview
        run: |
          rm -rf pages/v2
          mkdir -p pages/v2
          cp -a dist/. pages/v2/

      - name: Commit preview
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2
          if git diff --cached --quiet; then
            echo "No preview changes"
          else
            git commit -m "Preview: publish Fulham Plumbing redesign v2"
            git push origin gh-pages
          fi
