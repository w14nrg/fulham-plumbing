name: Publish V4 recovery preview

on:
  push:
    branches:
      - redesign/v4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V4
        uses: actions/checkout@v4
        with:
          ref: redesign/v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: npm run build

      - name: Rewrite links for GitHub Pages V4 path
        run: |
          find dist -name '*.html' -type f -print0 | xargs -0 sed -i \
            -e 's|href="/|href="/fulham-plumbing/v4/|g' \
            -e 's|src="/|src="/fulham-plumbing/v4/|g' \
            -e 's|action="/|action="/fulham-plumbing/v4/|g' \
            -e 's|"serviceUrl":"/|"serviceUrl":"/fulham-plumbing/v4/|g' \
            -e 's|"guideUrl":"/|"guideUrl":"/fulham-plumbing/v4/|g' \
            -e 's|"href":"/|"href":"/fulham-plumbing/v4/|g'
          touch dist/.nojekyll

      - name: Checkout existing Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Replace only V4 preview
        run: |
          rm -rf pages/v4
          mkdir -p pages/v4
          cp -a dist/. pages/v4/

      - name: Commit preview
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4
          if git diff --cached --quiet; then
            echo "No preview changes"
          else
            git commit -m "Preview: publish Fulham Plumbing V4"
            git push origin gh-pages
          fi
