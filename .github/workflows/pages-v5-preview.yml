name: Publish V5 Bad-Boiler-style preview

on:
  push:
    branches:
      - redesign/v5-badboiler-inspired
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-v5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V5
        uses: actions/checkout@v4
        with:
          ref: redesign/v5-badboiler-inspired

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check and build
        run: npm run check

      - name: Rewrite links for GitHub Pages V5 path
        run: |
          find dist -name '*.html' -type f -print0 | xargs -0 sed -i \
            -e 's|href="/|href="/fulham-plumbing/v5/|g' \
            -e 's|src="/|src="/fulham-plumbing/v5/|g' \
            -e 's|action="/|action="/fulham-plumbing/v5/|g'
          touch dist/.nojekyll

      - name: Checkout existing Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Replace only V5 preview
        run: |
          rm -rf pages/v5
          mkdir -p pages/v5
          cp -a dist/. pages/v5/

      - name: Commit preview
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v5
          if git diff --cached --quiet; then
            echo "No preview changes"
          else
            git commit -m "Preview: publish Fulham Plumbing V5"
            git push origin gh-pages
          fi
